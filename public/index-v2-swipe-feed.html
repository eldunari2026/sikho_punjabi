<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sikho Punjabi — Content Review</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22253a;
      --border: #2d3148;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --gurmukhi: #f1c40f;
      --roman: #93c5fd;
      --english: #cbd5e1;
      --accent: #6366f1;
      --retain: #22c55e;
      --remove: #ef4444;
      --edit: #f59e0b;
      --move: #8b5cf6;
      --badge-bg: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    [hidden] { display: none !important; }

    /* ── Name picker modal ───────────────────────────────────── */
    .name-picker-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 11, 16, 0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      backdrop-filter: blur(6px);
    }

    .name-picker-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 40px 32px;
      width: min(420px, 92vw);
      text-align: center;
    }

    .name-picker-box h2 { margin: 0 0 8px; font-size: 1.35rem; }
    .name-picker-box p { margin: 0 0 26px; color: var(--text-muted); font-size: 0.95rem; }

    .name-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
    }

    .name-btn {
      padding: 12px 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface2);
      color: var(--text);
      font-size: 1rem;
      transition: border-color 0.15s, background 0.15s;
    }
    .name-btn:hover { border-color: var(--accent); background: rgba(99, 102, 241, 0.12); }

    .change-name-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.82rem;
      padding: 0;
      text-decoration: underline;
    }
    .change-name-btn:hover { color: var(--text); }

    /* ── App layout ──────────────────────────────────────────── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }
    #app[hidden] { display: none !important; }

    .app-header {
      flex-shrink: 0;
      background: rgba(15, 17, 23, 0.96);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }

    .header-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 18px 10px;
      flex-wrap: wrap;
    }

    h1 { margin: 0; font-size: clamp(0.95rem, 2vw, 1.25rem); }

    .header-side {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 12px;
    }

    .reviewer-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 5px 10px;
      background: var(--surface);
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .stats-bar {
      color: var(--text-muted);
      font-size: 0.82rem;
      white-space: nowrap;
    }

    .save-status {
      min-width: 72px;
      color: var(--roman);
      font-size: 0.82rem;
      text-align: right;
    }
    .save-status.error { color: var(--remove); }

    .test-toggle {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 9px;
      background: var(--surface);
      color: var(--text);
      font-size: 0.82rem;
    }

    .test-panel {
      display: none;
      margin: 0 18px 10px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text-muted);
      font-size: 0.88rem;
      line-height: 1.7;
    }
    .test-panel.open { display: block; }
    .test-panel .ok { color: var(--retain); }
    .test-panel .warn { color: var(--edit); }
    .test-panel .err { color: var(--remove); }

    /* ── Feed wrap ───────────────────────────────────────────── */
    .feed-wrap {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 12px 16px 10px;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
      gap: 10px;
    }

    .progress-display {
      text-align: center;
      font-size: 0.82rem;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    /* ── Card stage ──────────────────────────────────────────── */
    .card-stage {
      flex: 1;
      position: relative;
      overflow: hidden;
      min-height: 0;
    }

    .swipe-card {
      position: absolute;
      inset: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 20px 16px;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      gap: 13px;
      touch-action: pan-y;
      user-select: none;
      will-change: transform;
      transition: border-color 0.1s;
    }

    .swipe-card.is-dragging { cursor: grabbing; }

    @keyframes flyRight {
      to { transform: translateX(140vw) rotate(20deg); opacity: 0; }
    }
    @keyframes flyLeft {
      to { transform: translateX(-140vw) rotate(-20deg); opacity: 0; }
    }
    @keyframes flyUp {
      to { transform: translateY(-60px) scale(0.95); opacity: 0; }
    }
    .swipe-card.fly-right { animation: flyRight 0.3s ease-in forwards; }
    .swipe-card.fly-left  { animation: flyLeft  0.3s ease-in forwards; }
    .swipe-card.fly-up    { animation: flyUp    0.25s ease-in forwards; }

    /* Swipe hint labels */
    .swipe-hint {
      position: absolute;
      top: 18px;
      pointer-events: none;
      border-radius: 7px;
      padding: 4px 12px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      opacity: 0;
      z-index: 10;
      border: 2px solid;
      text-transform: uppercase;
    }
    .swipe-hint.keep   { right: 16px; color: var(--retain); border-color: var(--retain); }
    .swipe-hint.remove { left: 16px;  color: var(--remove); border-color: var(--remove); }

    /* ── Card type badges ────────────────────────────────────── */
    .card-type-badge {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      flex-shrink: 0;
    }

    .type-chip {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .type-chip.vocab   { background: rgba(99,102,241,0.15); color: #a5b4fc; }
    .type-chip.proverb { background: rgba(245,158,11,0.15);  color: #fcd34d; }
    .type-chip.stream  { background: rgba(34,197,94,0.12);   color: #86efac; }

    .badge, .tag-chip {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      border-radius: 999px;
      padding: 2px 8px;
      background: var(--badge-bg);
      color: var(--text-muted);
      font-size: 0.78rem;
    }

    .card-title {
      margin: 0;
      font-size: 1.2rem;
      line-height: 1.3;
    }

    .muted {
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.45;
    }

    .gurmukhi {
      color: var(--gurmukhi);
      font-size: 1.3em;
      line-height: 1.75;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .first-line { font-size: 1.4em; }
    .large-text { font-size: 1.65rem; font-weight: 700; }
    .centered   { text-align: center; }

    .roman {
      color: var(--roman);
      line-height: 1.65;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .english {
      color: var(--english);
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .callout {
      border-left: 3px solid var(--accent);
      border-radius: 6px;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.035);
      color: var(--text-muted);
      font-style: italic;
      line-height: 1.55;
    }

    .chip-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 7px;
    }

    .excerpt-toggle {
      align-self: flex-start;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      background: var(--surface2);
      color: var(--text);
      font-size: 0.88rem;
    }
    .excerpt-body {
      display: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      background: rgba(15, 17, 23, 0.55);
      gap: 11px;
    }
    .excerpt-body.open { display: grid; }

    /* ── Master feed panel ───────────────────────────────────── */
    .master-feed-panel {
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      display: grid;
      gap: 6px;
      flex-shrink: 0;
    }
    .master-feed-label {
      color: var(--text-muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .master-feed-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 0.87rem;
      color: var(--text-muted);
    }
    .master-feed-name { color: var(--text); font-weight: 500; }

    /* ── Comment area ────────────────────────────────────────── */
    .comment-area {
      flex-shrink: 0;
    }
    .comment-area textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      padding: 9px 12px;
      resize: none;
      line-height: 1.5;
    }
    .comment-area textarea:focus {
      outline: 2px solid rgba(99, 102, 241, 0.35);
      outline-offset: 1px;
      border-color: var(--accent);
    }

    /* ── Action bar ──────────────────────────────────────────── */
    .action-bar {
      display: flex;
      gap: 7px;
      flex-shrink: 0;
    }

    .action-btn {
      flex: 1;
      padding: 11px 4px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 500;
      transition: background 0.12s, border-color 0.12s, transform 0.1s;
      white-space: nowrap;
    }
    .action-btn:hover { transform: translateY(-2px); background: var(--surface2); }
    .action-btn.retain-btn { border-color: rgba(34,197,94,0.45);  color: var(--retain); }
    .action-btn.remove-btn { border-color: rgba(239,68,68,0.45);  color: var(--remove); }
    .action-btn.edit-btn   { border-color: rgba(245,158,11,0.35); color: var(--edit); }
    .action-btn.move-btn   { border-color: rgba(139,92,246,0.35); color: var(--move); }

    .keyboard-hint {
      text-align: center;
      font-size: 0.72rem;
      color: var(--text-muted);
      opacity: 0.45;
      flex-shrink: 0;
      padding-bottom: 2px;
    }

    /* ── Feed done ───────────────────────────────────────────── */
    #feedDone {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 22px;
    }
    #feedDone[hidden] { display: none !important; }

    .feed-done-box {
      text-align: center;
      max-width: 360px;
    }
    .feed-done-box h2 { margin: 12px 0 8px; }
    .feed-done-box p  { color: var(--text-muted); margin: 0 0 16px; }
    .feed-done-stats  { color: var(--text-muted); font-size: 0.9rem; line-height: 1.8; }

    /* ── Responsive ──────────────────────────────────────────── */
    @media (max-width: 520px) {
      .keyboard-hint { display: none; }
      .feed-wrap { padding: 10px 12px 8px; gap: 8px; }
      .action-btn { font-size: 0.75rem; padding: 10px 2px; }
    }
  </style>
</head>

<body>
  <div id="namePicker" class="name-picker-overlay" hidden>
    <div class="name-picker-box">
      <h2>Who's reviewing?</h2>
      <p>Pick your name to start. Your feedback is saved privately.</p>
      <div id="nameGrid" class="name-grid"></div>
    </div>
  </div>

  <div id="app" hidden>
    <header class="app-header">
      <div class="header-main">
        <h1>Sikho Punjabi — Review</h1>
        <div class="header-side">
          <div class="reviewer-badge">
            <span id="reviewerBadge"></span>
            <button class="change-name-btn" id="changeNameBtn" type="button" hidden>Not you?</button>
          </div>
          <div id="statsBar" class="stats-bar"></div>
          <div id="saveStatus" class="save-status" aria-live="polite"></div>
          <button id="testToggle" class="test-toggle" type="button" aria-expanded="false">⚙ Tests</button>
        </div>
      </div>
      <div id="testPanel" class="test-panel" aria-live="polite"></div>
    </header>

    <div class="feed-wrap" id="feedWrap">
      <div id="progressDisplay" class="progress-display"></div>
      <div id="cardStage" class="card-stage"></div>
      <div class="comment-area">
        <textarea id="cardComment" rows="2" placeholder="Comment (optional)..."></textarea>
      </div>
      <div class="action-bar">
        <button class="action-btn remove-btn" data-action="remove">✕ Remove</button>
        <button class="action-btn skip-btn"   data-action="">Skip</button>
        <button class="action-btn edit-btn"   data-action="edit">✎ Edit</button>
        <button class="action-btn move-btn"   data-action="move">⇄ Move</button>
        <button class="action-btn retain-btn" data-action="retain">✓ Keep</button>
      </div>
      <div class="keyboard-hint">← remove &nbsp;·&nbsp; space skip &nbsp;·&nbsp; e edit &nbsp;·&nbsp; m move &nbsp;·&nbsp; keep →</div>
    </div>

    <div id="feedDone" hidden>
      <div class="feed-done-box">
        <div style="font-size:2.5rem">🎉</div>
        <h2>All caught up!</h2>
        <p>You've reviewed all available content.</p>
        <div id="feedDoneStats" class="feed-done-stats"></div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://aqmdxhrhvjxvdubvfzlj.supabase.co'
    const SUPABASE_ANON_KEY = 'sb_publishable_6X60jZNR8NkcQjSpqTO0UQ_4vA1QACe'
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    const streamConfig = [
      { key: "s1", code: "S1", label: "Gurbani" },
      { key: "s2", code: "S2", label: "Sufi/Kafi" },
      { key: "s3", code: "S3", label: "Kissa" },
      { key: "s4", code: "S4", label: "Medieval" },
      { key: "s5", code: "S5", label: "Modern Lit" },
      { key: "s6", code: "S6", label: "Folk/Lok Geet" },
      { key: "s7", code: "S7", label: "Boliyan" },
      { key: "s8", code: "S8", label: "Songs" },
      { key: "s9", code: "S9", label: "Dasam Granth" }
    ];

    const actionClasses = ["retain", "remove", "edit", "move"];

    let currentToken = "";
    let reviewerName = "";
    let reviewerRole = "reviewer";
    let streamsData = {};
    let vocabData = [];
    let proverbsData = [];
    let feedbackState = {};
    let allFeedback = {};
    let saveTimer = null;
    let savedClearTimer = null;
    let pendingSaves = {};
    let testResults = [];
    let reviewersList = [];

    // Feed state
    let feedQueue = [];
    let feedIndex = 0;
    let actionInProgress = false;

    // Swipe tracking (global, bound once)
    let swipeActiveCard = null;
    let swipeStartX = 0;
    let swipeStartY = 0;
    let swipeDragging = false;
    let swipeLocked = false;

    window.feedbackState = feedbackState;
    window.allFeedback = allFeedback;

    // ── Helpers ──────────────────────────────────────────────

    function esc(value) {
      if (value === null || value === undefined) return "";
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function itemId(item) {
      return item && item.id ? String(item.id) : "";
    }

    function romanReadable(item) {
      if (!item) return "";
      if (item.roman && typeof item.roman === "object" && item.roman.readable) return item.roman.readable;
      return item.roman_readable || item.romanization || "";
    }

    function fieldLine(parts) {
      const clean = parts.filter(Boolean);
      return clean.length ? `<div class="muted">${clean.map(esc).join(" · ")}</div>` : "";
    }

    function shuffleArray(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // ── Feed queue ────────────────────────────────────────────

    function buildFeed() {
      const all = [];
      Object.entries(streamsData).forEach(([streamKey, items]) => {
        (items || []).forEach(item => all.push({ type: "stream", streamKey, item }));
      });
      vocabData.forEach(item => all.push({ type: "vocab", item }));
      proverbsData.forEach(item => all.push({ type: "proverb", item }));

      const unreviewed = all.filter(entry => {
        const id = itemId(entry.item);
        const state = feedbackState[id];
        return !state || !state.action;
      });

      feedQueue = shuffleArray(unreviewed);
      feedIndex = 0;
    }

    function updateProgress() {
      const remaining = feedQueue.length - feedIndex;
      document.getElementById("progressDisplay").textContent =
        remaining > 0 ? `${remaining} remaining` : "";
    }

    function showCurrentCard() {
      updateProgress();
      if (feedIndex >= feedQueue.length) {
        document.getElementById("feedWrap").hidden = true;
        document.getElementById("feedDone").hidden = false;
        const counts = { retain: 0, remove: 0, edit: 0, move: 0 };
        Object.values(feedbackState).forEach(e => {
          if (e && counts[e.action] !== undefined) counts[e.action]++;
        });
        document.getElementById("feedDoneStats").innerHTML =
          `${counts.retain} kept · ${counts.remove} removed · ${counts.edit + counts.move} flagged`;
        return;
      }
      renderFeedCard(feedQueue[feedIndex]);
    }

    // ── Card rendering ────────────────────────────────────────

    function renderFeedCard(entry) {
      const id = itemId(entry.item);
      let contentHtml = "";

      if (entry.type === "stream") {
        contentHtml = buildStreamCardHtml(entry.item, entry.streamKey);
      } else if (entry.type === "vocab") {
        contentHtml = buildVocabCardHtml(entry.item);
      } else {
        contentHtml = buildProverbCardHtml(entry.item);
      }

      let masterHtml = "";
      if (reviewerRole === "master") {
        const reviews = (allFeedback[id] || []).filter(r => r.action);
        if (reviews.length) {
          masterHtml = `
            <div class="master-feed-panel">
              <div class="master-feed-label">Reviewer decisions</div>
              ${reviews.map(r => `
                <div class="master-feed-row">
                  <span class="master-feed-name">${esc(r.reviewer_name)}</span>
                  <span>${esc(r.action)}</span>
                  ${r.comment ? `<span class="muted">— ${esc(r.comment)}</span>` : ""}
                </div>
              `).join("")}
            </div>`;
        }
      }

      document.getElementById("cardStage").innerHTML = `
        <div class="swipe-card" id="activeCard" data-id="${esc(id)}">
          <span class="swipe-hint keep">KEEP ✓</span>
          <span class="swipe-hint remove">✕ REMOVE</span>
          ${contentHtml}
          ${masterHtml}
        </div>`;

      const existing = feedbackState[id];
      document.getElementById("cardComment").value =
        existing && existing.comment ? existing.comment : "";
    }

    function buildStreamCardHtml(item, streamKey) {
      const stream = streamConfig.find(s => s.key === streamKey) || { code: streamKey.toUpperCase(), label: streamKey };
      const hasExcerpt = item.full_excerpt_gurmukhi || item.romanization || item.english_meaning;
      return `
        <div class="card-type-badge">
          <span class="type-chip stream">${esc(stream.code)}: ${esc(stream.label)}</span>
          ${item.form ? `<span class="badge">${esc(item.form)}</span>` : ""}
          ${item.register ? `<span class="badge">${esc(item.register)}</span>` : ""}
        </div>
        ${item.title ? `<h2 class="card-title">${esc(item.title)}</h2>` : ""}
        ${fieldLine([item.author, item.source_bani, item.source_granth, item.ang_or_location])}
        ${item.first_line_gurmukhi ? `<div class="gurmukhi first-line">${esc(item.first_line_gurmukhi)}</div>` : ""}
        ${hasExcerpt ? `
          <button class="excerpt-toggle" type="button" aria-expanded="false">Show full excerpt ▼</button>
          <div class="excerpt-body">
            ${item.full_excerpt_gurmukhi ? `<div class="gurmukhi">${esc(item.full_excerpt_gurmukhi)}</div>` : ""}
            ${item.romanization ? `<div class="roman">${esc(item.romanization)}</div>` : ""}
            ${item.english_meaning ? `<div class="english">${esc(item.english_meaning)}</div>` : ""}
          </div>` : ""}
        ${item.why_dense ? `<div class="callout">${esc(item.why_dense)}</div>` : ""}`;
    }

    function buildVocabCardHtml(item) {
      const tags = Array.isArray(item.tags) ? item.tags : [];
      const readable = romanReadable(item);
      return `
        <div class="card-type-badge">
          <span class="type-chip vocab">Vocab</span>
          ${item.source ? `<span class="badge">${esc(item.source)}</span>` : ""}
        </div>
        ${item.gurmukhi ? `<div class="gurmukhi large-text centered">${esc(item.gurmukhi)}</div>` : ""}
        ${readable ? `<div class="roman centered">${esc(readable)}</div>` : ""}
        ${item.english ? `<div class="english centered">${esc(item.english)}</div>` : ""}
        <div class="chip-row">
          ${item.part_of_speech ? `<span class="badge">${esc(item.part_of_speech)}</span>` : ""}
          ${tags.map(t => `<span class="tag-chip">${esc(t)}</span>`).join("")}
        </div>`;
    }

    function buildProverbCardHtml(item) {
      const readable = romanReadable(item);
      return `
        <div class="card-type-badge">
          <span class="type-chip proverb">Proverb</span>
          ${item.selection_theme ? `<span class="badge">${esc(item.selection_theme)}</span>` : ""}
        </div>
        ${item.gurmukhi ? `<div class="gurmukhi large-text centered">${esc(item.gurmukhi)}</div>` : ""}
        ${readable ? `<div class="roman centered">${esc(readable)}</div>` : ""}
        ${item.english ? `<div class="english centered">${esc(item.english)}</div>` : ""}
        ${item.cultural_note ? `<div class="muted centered"><em>${esc(item.cultural_note)}</em></div>` : ""}`;
    }

    // ── Actions ───────────────────────────────────────────────

    async function applyAction(action) {
      if (actionInProgress) return;
      if (feedIndex >= feedQueue.length) return;
      actionInProgress = true;

      const entry = feedQueue[feedIndex];
      const id = itemId(entry.item);
      const comment = document.getElementById("cardComment").value.trim();

      if (action) {
        feedbackState[id] = { action, comment };
        pendingSaves[id] = { action, comment };
        updateStats();
        scheduleSave();
      }

      const card = document.getElementById("activeCard");
      if (card) {
        const cls = action === "retain" ? "fly-right" : action === "remove" ? "fly-left" : "fly-up";
        card.classList.add(cls);
        await new Promise(r => setTimeout(r, 300));
      }

      feedIndex++;
      document.getElementById("cardComment").value = "";
      actionInProgress = false;
      showCurrentCard();
    }

    // ── Swipe gesture (global, bound once) ───────────────────

    function onSwipeStart(card, x, y) {
      swipeActiveCard = card;
      swipeStartX = x;
      swipeStartY = y;
      swipeDragging = true;
      swipeLocked = false;
      card.classList.add("is-dragging");
    }

    function onSwipeMove(x, y) {
      if (!swipeDragging || !swipeActiveCard) return;
      const dx = x - swipeStartX;
      const dy = y - swipeStartY;
      if (!swipeLocked && Math.abs(dy) > Math.abs(dx) + 8) {
        swipeDragging = false;
        swipeActiveCard.style.transform = "";
        swipeActiveCard.style.borderColor = "";
        swipeActiveCard.classList.remove("is-dragging");
        swipeActiveCard = null;
        return;
      }
      swipeLocked = true;
      swipeActiveCard.style.transform = `translateX(${dx}px) rotate(${dx * 0.025}deg)`;
      const keepHint   = swipeActiveCard.querySelector(".swipe-hint.keep");
      const removeHint = swipeActiveCard.querySelector(".swipe-hint.remove");
      if (dx > 40) {
        swipeActiveCard.style.borderColor = "rgba(34,197,94,0.55)";
        if (keepHint)   keepHint.style.opacity   = Math.min(1, (dx - 40) / 60);
        if (removeHint) removeHint.style.opacity = "0";
      } else if (dx < -40) {
        swipeActiveCard.style.borderColor = "rgba(239,68,68,0.55)";
        if (removeHint) removeHint.style.opacity = Math.min(1, (-dx - 40) / 60);
        if (keepHint)   keepHint.style.opacity   = "0";
      } else {
        swipeActiveCard.style.borderColor = "";
        if (keepHint)   keepHint.style.opacity = "0";
        if (removeHint) removeHint.style.opacity = "0";
      }
    }

    function onSwipeEnd(x) {
      if (!swipeDragging || !swipeActiveCard) return;
      swipeDragging = false;
      swipeActiveCard.classList.remove("is-dragging");
      swipeActiveCard.style.transform = "";
      swipeActiveCard.style.borderColor = "";
      const keepHint   = swipeActiveCard.querySelector(".swipe-hint.keep");
      const removeHint = swipeActiveCard.querySelector(".swipe-hint.remove");
      if (keepHint)   keepHint.style.opacity = "0";
      if (removeHint) removeHint.style.opacity = "0";
      const dx = x - swipeStartX;
      swipeActiveCard = null;
      if (dx > 90)  applyAction("retain");
      else if (dx < -90) applyAction("remove");
    }

    // ── Save / stats ─────────────────────────────────────────

    function scheduleSave() {
      clearTimeout(saveTimer);
      setSaveStatus("Saving...");
      saveTimer = setTimeout(savePendingFeedback, 1000);
    }

    async function savePendingFeedback() {
      const rows = Object.entries(pendingSaves).map(([id, entry]) => ({
        reviewer_token: currentToken,
        reviewer_name: reviewerName,
        item_id: id,
        action: entry.action || "",
        comment: entry.comment || "",
        updated_at: new Date().toISOString()
      }));
      if (!rows.length) return;
      try {
        const { error } = await sb.from("feedback").upsert(rows, { onConflict: "reviewer_token,item_id" });
        if (error) throw error;
        rows.forEach(row => { delete pendingSaves[row.item_id]; });
        showSaved();
        addTestResult("ok", `Saved feedback for ${rows.length} item${rows.length === 1 ? "" : "s"}`);
      } catch (error) {
        setSaveStatus("Save failed — check connection", true);
        addTestResult("err", `Feedback save failed: ${error.message || error}`);
        renderTestPanel();
      }
    }

    function setSaveStatus(text, isError = false) {
      clearTimeout(savedClearTimer);
      const status = document.getElementById("saveStatus");
      status.textContent = text;
      status.classList.toggle("error", isError);
    }

    function showSaved() {
      clearTimeout(savedClearTimer);
      const status = document.getElementById("saveStatus");
      status.textContent = "Saved ✓";
      status.classList.remove("error");
      savedClearTimer = setTimeout(() => { status.textContent = ""; }, 2000);
    }

    function updateStats() {
      const counts = { retain: 0, remove: 0, edit: 0, move: 0 };
      Object.values(feedbackState).forEach(entry => {
        if (entry && Object.prototype.hasOwnProperty.call(counts, entry.action)) counts[entry.action]++;
      });
      const flagged = counts.edit + counts.move;
      const total = counts.retain + counts.remove + flagged;
      document.getElementById("statsBar").textContent =
        `${counts.retain} kept / ${counts.remove} removed / ${flagged} flagged / ${total} total`;
    }

    // ── Test panel ────────────────────────────────────────────

    function addTestResult(kind, text) {
      testResults.push({ kind, text });
    }

    function renderTestPanel() {
      document.getElementById("testPanel").innerHTML = testResults.length
        ? testResults.map(r => `<div class="${r.kind}">${esc(r.text)}</div>`).join("")
        : `<div class="warn">Loading...</div>`;
    }

    // ── Auth / name picker ────────────────────────────────────

    function showNamePicker() {
      document.getElementById("app").hidden = true;
      document.getElementById("namePicker").hidden = false;
      document.getElementById("nameGrid").innerHTML = reviewersList.map(r =>
        `<button class="name-btn" type="button" data-name="${esc(r.name)}">${esc(r.name)}</button>`
      ).join("");
    }

    function pickName(name) {
      const reviewer = reviewersList.find(r => r.name === name);
      if (!reviewer) return;
      localStorage.setItem("review_name", name);
      currentToken = name;
      reviewerName = name;
      reviewerRole = reviewer.role === "master" ? "master" : "reviewer";
      document.getElementById("namePicker").hidden = true;
      showApp();
    }

    function showApp() {
      document.getElementById("namePicker").hidden = true;
      document.getElementById("app").hidden = false;
      document.getElementById("reviewerBadge").textContent = `Reviewing as ${reviewerName}`;
      document.getElementById("changeNameBtn").hidden = false;
    }

    async function checkNameAndStart() {
      reviewersList = await fetchJson("/reviewers.json");
      if (!Array.isArray(reviewersList) || !reviewersList.length) {
        addTestResult("err", "reviewers.json is empty or invalid");
        renderTestPanel();
        return false;
      }
      const saved = localStorage.getItem("review_name");
      const match = saved && reviewersList.find(r => r.name === saved);
      if (match) {
        currentToken = saved;
        reviewerName = saved;
        reviewerRole = match.role === "master" ? "master" : "reviewer";
        return true;
      }
      showNamePicker();
      return false;
    }

    // ── Data loading ──────────────────────────────────────────

    async function fetchJson(url) {
      const r = await fetch(url);
      if (!r.ok) { const e = new Error(`HTTP ${r.status}`); e.status = r.status; throw e; }
      return r.json();
    }

    async function loadReviewerFeedback() {
      const { data, error } = await sb.from("feedback")
        .select("item_id, action, comment")
        .eq("reviewer_token", currentToken);
      if (error) throw error;
      feedbackState = {};
      (data || []).forEach(row => {
        if (row.item_id) feedbackState[row.item_id] = { action: row.action || "", comment: row.comment || "" };
      });
      window.feedbackState = feedbackState;
      return data || [];
    }

    async function loadAllFeedback() {
      const { data, error } = await sb.from("feedback")
        .select("reviewer_name, item_id, action, comment");
      if (error) throw error;
      allFeedback = {};
      (data || []).forEach(row => {
        if (!row.item_id) return;
        if (!allFeedback[row.item_id]) allFeedback[row.item_id] = [];
        allFeedback[row.item_id].push({
          reviewer_name: row.reviewer_name || "Unknown",
          action: row.action || "",
          comment: row.comment || ""
        });
      });
      window.allFeedback = allFeedback;
      return data || [];
    }

    function countStreamItems(streams) {
      return Object.values(streams || {}).reduce((sum, items) => sum + (Array.isArray(items) ? items.length : 0), 0);
    }

    async function loadDataAndFeedback() {
      const [streamsResult, vocabResult, proverbsResult, reviewerFeedbackResult, allFeedbackResult] =
        await Promise.allSettled([
          fetchJson("/data/streams.json"),
          fetchJson("/data/vocab.json"),
          fetchJson("/data/proverbs.json"),
          loadReviewerFeedback(),
          ...(reviewerRole === "master" ? [loadAllFeedback()] : [])
        ]);

      if (streamsResult.status === "fulfilled") {
        streamsData = streamsResult.value || {};
        addTestResult("ok", `Streams loaded: ${countStreamItems(streamsData)} items`);
      } else {
        addTestResult("err", `Streams error: ${streamsResult.reason.message}`);
      }

      if (vocabResult.status === "fulfilled") {
        vocabData = Array.isArray(vocabResult.value) ? vocabResult.value : [];
        addTestResult("ok", `Vocab loaded: ${vocabData.length} items`);
      } else {
        addTestResult("err", `Vocab error: ${vocabResult.reason.message}`);
      }

      if (proverbsResult.status === "fulfilled") {
        proverbsData = Array.isArray(proverbsResult.value) ? proverbsResult.value : [];
        addTestResult("ok", `Proverbs loaded: ${proverbsData.length} items`);
      } else {
        addTestResult("err", `Proverbs error: ${proverbsResult.reason.message}`);
      }

      if (reviewerFeedbackResult.status === "fulfilled") {
        addTestResult("ok", `Your feedback loaded: ${Object.keys(feedbackState).length} decisions`);
      } else {
        addTestResult("err", `Feedback error: ${reviewerFeedbackResult.reason?.message || reviewerFeedbackResult.reason}`);
      }

      if (reviewerRole === "master" && allFeedbackResult) {
        if (allFeedbackResult.status === "fulfilled") {
          const total = Object.values(allFeedback).reduce((s, rows) => s + rows.length, 0);
          addTestResult("ok", `All feedback loaded: ${total} reviews`);
        } else {
          addTestResult("err", `All feedback error: ${allFeedbackResult.reason?.message || allFeedbackResult.reason}`);
        }
      }

      renderTestPanel();
      buildFeed();
      updateStats();
      showCurrentCard();
    }

    // ── Event binding ─────────────────────────────────────────

    function bindEvents() {
      // Test panel toggle
      document.getElementById("testToggle").addEventListener("click", e => {
        const panel = document.getElementById("testPanel");
        panel.classList.toggle("open");
        e.currentTarget.setAttribute("aria-expanded", String(panel.classList.contains("open")));
      });

      // Excerpt toggle (delegated)
      document.addEventListener("click", e => {
        const btn = e.target.closest(".excerpt-toggle");
        if (!btn) return;
        const body = btn.nextElementSibling;
        const open = body.classList.toggle("open");
        btn.setAttribute("aria-expanded", String(open));
        btn.textContent = open ? "Hide full excerpt ▲" : "Show full excerpt ▼";
      });

      // Action buttons
      document.querySelector(".action-bar").addEventListener("click", e => {
        const btn = e.target.closest("[data-action]");
        if (!btn) return;
        applyAction(btn.dataset.action);
      });

      // Keyboard shortcuts
      document.addEventListener("keydown", e => {
        const tag = document.activeElement.tagName;
        if (tag === "TEXTAREA" || tag === "INPUT") return;
        if (e.key === "ArrowRight" || e.key === "l") applyAction("retain");
        else if (e.key === "ArrowLeft" || e.key === "h") applyAction("remove");
        else if (e.key === " ") { e.preventDefault(); applyAction(""); }
        else if (e.key === "e" || e.key === "E") applyAction("edit");
        else if (e.key === "m" || e.key === "M") applyAction("move");
      });

      // Global swipe (touch)
      const stage = document.getElementById("cardStage");
      stage.addEventListener("touchstart", e => {
        const card = e.target.closest(".swipe-card");
        if (card) onSwipeStart(card, e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: true });
      stage.addEventListener("touchmove", e => {
        if (swipeDragging) onSwipeMove(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: true });
      stage.addEventListener("touchend", e => {
        if (swipeDragging) onSwipeEnd(e.changedTouches[0].clientX);
      }, { passive: true });

      // Global swipe (mouse — desktop drag)
      stage.addEventListener("mousedown", e => {
        const card = e.target.closest(".swipe-card");
        if (card) onSwipeStart(card, e.clientX, e.clientY);
      });
      document.addEventListener("mousemove", e => {
        if (swipeDragging) { e.preventDefault(); onSwipeMove(e.clientX, e.clientY); }
      });
      document.addEventListener("mouseup", e => {
        if (swipeDragging) onSwipeEnd(e.clientX);
      });
    }

    // ── App start ─────────────────────────────────────────────

    async function startApp() {
      showApp();
      addTestResult("ok", `Reviewing as: ${reviewerName} (${reviewerRole})`);
      renderTestPanel();
      await loadDataAndFeedback();
    }

    document.addEventListener("DOMContentLoaded", async () => {
      bindEvents();
      renderTestPanel();

      document.getElementById("nameGrid").addEventListener("click", async e => {
        const btn = e.target.closest(".name-btn");
        if (!btn) return;
        pickName(btn.dataset.name);
        await startApp();
      });

      document.getElementById("changeNameBtn").addEventListener("click", () => {
        localStorage.removeItem("review_name");
        currentToken = "";
        reviewerName = "";
        reviewerRole = "reviewer";
        feedbackState = {};
        allFeedback = {};
        feedQueue = [];
        feedIndex = 0;
        showNamePicker();
      });

      try {
        const ready = await checkNameAndStart();
        if (ready) await startApp();
      } catch (error) {
        addTestResult("err", `Startup error: ${error.message || error}`);
        renderTestPanel();
        showNamePicker();
      }
    });
  </script>
</body>
